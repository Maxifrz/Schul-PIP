<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Schul-PIP Rechner</title>
<link rel="stylesheet" href="mathe.css">
<script src="cas.js"></script>
<script>
  // Giac reports to CAS; the app starts once it is ready (Mathe.start is defined by mathe.js).
  var Module = {
    print: function (line) { CAS.captured(line); },
    printErr: function (line) { CAS.captured(line); },
    onRuntimeInitialized: function () {
      CAS.init(Module.cwrap('caseval', 'string', ['string']));
      window.__giacReady = true;
      if (window.Mathe && window.Mathe.giacReady) window.Mathe.giacReady();
    },
  };
</script>
<script src="mathe.js"></script>
<script src="giacwasm.js" async></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
