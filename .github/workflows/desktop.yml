name: Desktop

on:
  push:
    branches: ["**"]
    paths: ["desktop/**", "cas/web/**", "Lernwerk/Resources/Fonts/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "cas/web/**", "Lernwerk/Resources/Fonts/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Types and unit tests
        run: |
          npm run typecheck
          npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: The screens in a browser, against a fake server
        run: node test/ui/smoke.mjs
      - name: The real Electron app
        run: xvfb-run -a node test/ui/electron.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: desktop/build-ui/*.png
          if-no-files-found: ignore

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build the installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Schul-PIP-Windows
          path: desktop/release/Schul-PIP-Setup-*.exe
