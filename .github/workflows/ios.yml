name: iOS

on:
  push:
    branches: ["**"]
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          DEVICE_ID=$(python3 scripts/pick-simulator.py)
          xcodebuild test \
            -project Lernwerk.xcodeproj \
            -scheme Lernwerk \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|warning: .*Lernwerk|Test Case .* (passed|failed)|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lernwerk.xcodeproj \
            -scheme Lernwerk \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lernwerk.app Payload/
          zip -qr Lernwerk-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lernwerk-unsigned-ipa
          path: Lernwerk-unsigned.ipa
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            test.log
            build.log
          if-no-files-found: ignore
