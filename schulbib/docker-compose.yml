services:
  db:
    image: postgres:16-alpine
    container_name: schulbib-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schulbib
      POSTGRES_PASSWORD: schulbib
      POSTGRES_DB: schulbib
    ports:
      - "5432:5432"
    volumes:
      - schulbib-data:/var/lib/postgresql/data

volumes:
  schulbib-data:
